<style>
:root{--bg:#0b1020;--panel:#141c32;--panel2:#1c2743;--text:#f4f7ff;--muted:#aab6d3;--accent:#7c5cff;--accent2:#19d3c5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(ellipse at top,#202b51 0%,var(--bg) 58%);color:var(--text);min-height:100vh}
header{text-align:center;padding:48px 18px 28px}header .eyebrow{color:var(--accent2);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.78rem}
h1{font-size:clamp(2.3rem,7vw,4.7rem);margin:10px 0;background:linear-gradient(90deg,#fff,#bcb0ff,#64f0e5);background-clip:text;color:transparent}
header p{color:var(--muted);max-width:650px;margin:0 auto;line-height:1.6}
main{max-width:1180px;margin:auto;padding:0 18px 60px}
.toolbar{position:sticky;top:0;z-index:5;background:#0b1020eF;backdrop-filter:blur(12px);padding:16px 0;display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:12px}
input,select{width:100%;padding:13px 15px;border:1px solid #344365;border-radius:12px;background:var(--panel);color:var(--text);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #19d3c522}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px}
.filter{border:1px solid #344365;background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:650}
.filter.active,.filter:hover{background:var(--accent);border-color:var(--accent);color:white}
.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:.9rem;margin:12px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.game{background:linear-gradient(145deg,var(--panel),#10172a);border:1px solid #293654;border-radius:18px;padding:18px;min-height:190px;display:flex;flex-direction:column;gap:12px;transition:transform .18s,border-color .18s,box-shadow .18s}
.game:hover{transform:translateY(-4px);border-color:#7664ff;box-shadow:0 12px 30px #0004}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.emoji{font-size:2rem}.tag{font-size:.72rem;color:#bfb4ff;background:#7c5cff22;border:1px solid #7c5cff55;border-radius:999px;padding:5px 9px;white-space:nowrap}
h2{font-size:1.08rem;margin:0}.desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;color:#8f9dbd;font-size:.76rem;border-top:1px solid #293654;padding-top:11px}
.empty{display:none;text-align:center;color:var(--muted);padding:50px 12px}
footer{text-align:center;color:#7f8bab;font-size:.82rem;padding:22px}
@media(max-width:620px){.toolbar{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}}
</style>
</head>

const uniqueGames = [...new Map(games.map(g=>[g.name,g])).values()];
const genres=["All",...new Set(uniqueGames.map(g=>g.genre))];
let active="All";
const filterBox=document.getElementById("filters");
genres.forEach(genre=>{const b=document.createElement("button");b.className="filter"+(genre==="All"?" active":"");b.textContent=genre;b.type="button";b.onclick=()=>{active=genre;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()};filterBox.appendChild(b)});
function render(){const q=document.getElementById("search").value.trim().toLowerCase();const sort=document.getElementById("sort").value;let shown=uniqueGames.filter(g=>(active==="All"||g.genre===active)&&(g.name.toLowerCase().includes(q)||g.genre.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q)));shown.sort((a,b)=>sort==="za"?b.name.localeCompare(a.name):sort==="genre"?a.genre.localeCompare(b.genre)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));const root=document.getElementById("games");root.innerHTML="";shown.forEach(g=>{const card=document.createElement("article");card.className="game";card.innerHTML=`<div class="top"><span class="emoji" aria-hidden="true">${g.emoji}</span><span class="tag">${g.genre}</span></div><h2></h2><p class="desc"></p><div class="meta"><span>World of Games</span><span>Game</span></div>`;card.querySelector("h2").textContent=g.name;card.querySelector(".desc").textContent=g.desc;root.appendChild(card)});document.getElementById("count").textContent=`Showing ${shown.length} of ${uniqueGames.length} games`;document.getElementById("empty").style.display=shown.length?"none":"block"}
document.getElementById("search").addEventListener("input",render);document.getElementById("sort").addEventListener("change",render);render();
