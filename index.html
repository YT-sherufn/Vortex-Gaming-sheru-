



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Games | Top 100 Games</title>

    <style>
        :root {
            --bg: #090914;
            --card: #171728;
            --purple: #a77bff;
            --pink: #ff2d75;
            --text: #ffffff;
            --muted: #b9b9cc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            text-align: center;
            padding: 55px 20px 45px;
            background: linear-gradient(135deg, #5421c9, #c51e69);
        }

        header h1 {
            font-size: clamp(32px, 6vw, 55px);
            margin: 0 0 12px;
        }

        header p {
            color: #f0eaff;
            font-size: 17px;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        input, select {
            background: #171728;
            color: white;
            border: 1px solid #34344d;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            outline: none;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        select {
            min-width: 170px;
        }

        input:focus, select:focus {
            border-color: var(--purple);
        }

        .info {
            color: var(--muted);
            margin: 15px 0 25px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(220px, 1fr)
            );
            gap: 20px;
        }

        .game {
            background: var(--card);
            border: 1px solid #292940;
            border-radius: 15px;
            padding: 22px;
            transition: transform 0.2s, border-color 0.2s;
            min-width: 0;
        }

        .game:hover {
            transform: translateY(-5px);
            border-color: var(--purple);
        }

        .game-number {
            color: var(--pink);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .game h2 {
            color: var(--purple);
            font-size: 19px;
            margin: 12px 0;
        }

        .game p {
            color: #ccccdd;
            line-height: 1.5;
            font-size: 14px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 15px;
        }

        .tag {
            background: #29213e;
            color: #d6bfff;
            border-radius: 20px;
            padding: 6px 9px;
            font-size: 11px;
        }

        .empty {
            display: none;
            text-align: center;
            color: var(--muted);
            padding: 50px 10px;
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            color: #88889f;
            font-size: 13px;
        }


        .game { cursor: pointer; }
        .game:focus-visible { outline: 2px solid var(--purple); outline-offset: 3px; }
        .detail-page {
            display: none;
            background: var(--card);
            border: 1px solid #34344d;
            border-radius: 16px;
            padding: 28px;
            max-width: 850px;
            margin: 20px auto;
        }
        .detail-page h2 { color: var(--purple); font-size: clamp(26px, 4vw, 38px); }
        .detail-page p { color: #ccccdd; line-height: 1.7; }
        .detail-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
        .detail-actions a, .back-button {
            display: inline-block;
            background: #29213e;
            color: white;
            border: 1px solid #51406f;
            border-radius: 10px;
            padding: 12px 16px;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
        }
        .detail-actions a:hover, .back-button:hover { border-color: var(--purple); }

        @media (max-width: 500px) {
            .container {
                padding: 20px 12px;
            }

            .games {
                grid-template-columns: 1fr;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 World of Games</h1>
    <p>Discover 100 famous games across PC, console, and mobile!</p>
</header>

<main class="container">

    <div class="controls">
        <input
            type="search"
            id="search"
            placeholder="🔍 Search games..."
            aria-label="Search games"
        >

        <select id="genre" aria-label="Filter by genre">
            <option value="All">All Genres</option>
            <option value="Action">Action</option>
            <option value="Adventure">Adventure</option>
            <option value="RPG">RPG</option>
            <option value="Shooter">Shooter</option>
            <option value="Racing">Racing</option>
            <option value="Sports">Sports</option>
            <option value="Strategy">Strategy</option>
            <option value="Sandbox">Sandbox</option>
            <option value="Simulation">Simulation</option>
            <option value="Horror">Horror</option>
            <option value="Puzzle">Puzzle</option>
            <option value="Battle Royale">Battle Royale</option>
            <option value="MOBA">MOBA</option>
            <option value="Fighting">Fighting</option>
        </select>

        <select id="platform" aria-label="Filter by platform">
            <option value="All">All Platforms</option>
            <option value="PC">PC</option>
            <option value="PlayStation">PlayStation</option>
            <option value="Xbox">Xbox</option>
            <option value="Nintendo">Nintendo</option>
            <option value="Mobile">Mobile</option>
        </select>
    </div>

    <p class="info" id="count" aria-live="polite">
        Loading games...
    </p>

    <div class="games" id="games"></div>

    <div class="empty" id="empty">
        <h2>😢 No games found</h2>
        <p>Try another search or choose a different filter.</p>
    </div>

    <section class="detail-page" id="detailPage" aria-live="polite">
        <button class="back-button" id="backButton" type="button">← Back to games</button>
        <h2 id="detailTitle"></h2>
        <p id="detailDescription"></p>
        <p><strong>Genre:</strong> <span id="detailGenre"></span></p>
        <p><strong>Platforms:</strong> <span id="detailPlatforms"></span></p>
        <div class="detail-actions">
            <a id="googleSearch" href="#" target="_blank" rel="noopener noreferrer">🔍 Search this game on Google</a>
        </div>
    </section>

</main>

<footer>
    🎮 World of Games — Explore your next favorite game!
</footer>

const gamesContainer = document.getElementById("games");
const searchInput = document.getElementById("search");
const genreSelect = document.getElementById("genre");
const platformSelect = document.getElementById("platform");
const count = document.getElementById("count");
const empty = document.getElementById("empty");

function renderGames() {
    const search = searchInput.value.toLowerCase().trim();
    const genre = genreSelect.value;
    const platform = platformSelect.value;

    const filtered = games.filter(game => {
        const matchesSearch =
            game[0].toLowerCase().includes(search) ||
            game[1].toLowerCase().includes(search) ||
            game[3].toLowerCase().includes(search);

        const matchesGenre =
            genre === "All" || game[1] === genre;

        const matchesPlatform =
            platform === "All" ||
            game[2].split(", ").includes(platform);

        return matchesSearch && matchesGenre && matchesPlatform;
    });

    gamesContainer.innerHTML = "";

    filtered.forEach(game => {
        const originalNumber = games.indexOf(game) + 1;

        const card = document.createElement("article");
        card.className = "game";

        const number = document.createElement("div");
        number.className = "game-number";
        number.textContent = "GAME #" + String(originalNumber).padStart(3, "0");

        const title = document.createElement("h2");
        title.textContent = game[0];

        const description = document.createElement("p");
        description.textContent = game[3];

        const tags = document.createElement("div");
        tags.className = "tags";

        [game[1], ...game[2].split(", ")].forEach(label => {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = label;
            tags.appendChild(tag);
        });

        card.tabIndex = 0;
        card.setAttribute("role", "link");
        card.setAttribute("aria-label", "View details for " + game[0]);
        const openDetails = () => {
            location.hash = "game=" + encodeURIComponent(game[0]);
            showGameDetails(game[0]);
        };
        card.addEventListener("click", openDetails);
        card.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openDetails();
            }
        });
        card.append(number, title, description, tags);
        gamesContainer.appendChild(card);
    });

    count.textContent =
        `Showing ${filtered.length} of ${games.length} games`;

    empty.style.display = filtered.length ? "none" : "block";
}

const detailPage = document.getElementById("detailPage");
const detailTitle = document.getElementById("detailTitle");
const detailDescription = document.getElementById("detailDescription");
const detailGenre = document.getElementById("detailGenre");
const detailPlatforms = document.getElementById("detailPlatforms");
const googleSearch = document.getElementById("googleSearch");

function showGameDetails(gameName) {
    const game = games.find(item => item[0] === gameName);
    if (!game) {
        showGameList();
        return;
    }
    detailTitle.textContent = game[0];
    detailDescription.textContent = game[3];
    detailGenre.textContent = game[1];
    detailPlatforms.textContent = game[2];
    googleSearch.href = "https://www.google.com/search?q=" + encodeURIComponent(game[0]);
    document.querySelector(".controls").style.display = "none";
    document.getElementById("count").style.display = "none";
    gamesContainer.style.display = "none";
    empty.style.display = "none";
    detailPage.style.display = "block";
    window.scrollTo(0, 0);
}

function showGameList() {
    detailPage.style.display = "none";
    document.querySelector(".controls").style.display = "flex";
    document.getElementById("count").style.display = "block";
    gamesContainer.style.display = "grid";
    renderGames();
}

document.getElementById("backButton").addEventListener("click", () => {
    history.pushState(null, "", location.pathname + location.search);
    showGameList();
});

window.addEventListener("hashchange", () => {
    const match = location.hash.match(/^#game=(.*)$/);
    if (match) {
        showGameDetails(decodeURIComponent(match[1]));
    } else {
        showGameList();
    }
});

searchInput.addEventListener("input", renderGames);
genreSelect.addEventListener("change", renderGames);
platformSelect.addEventListener("change", renderGames);

renderGames();
const initialMatch = location.hash.match(/^#game=(.*)$/);
if (initialMatch) showGameDetails(decodeURIComponent(initialMatch[1]));
</script>

</body>
</html>
